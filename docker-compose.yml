services:
  app:
    build:
      context: .
      args:
        LLAMA_PIP_EXTRA_INDEX: ${LLAMA_PIP_EXTRA_INDEX:-https://abetlen.github.io/llama-cpp-python/whl/cpu}
        LLAMA_CMAKE_ARGS: ${LLAMA_CMAKE_ARGS:-}
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${HOST_PORT:-8501}:8501"
    volumes:
      - ${AI_MODELS_DIR:-./models}:/app/ai_models
    environment:
      - AI_MODELS_DIR=/app/ai_models
      - HF_TOKEN=${HF_TOKEN:-}
      - LLAMA_SERVER_PORT=${LLAMA_SERVER_PORT:-8001}
      - LLAMA_N_CTX=${LLAMA_N_CTX:-2048}
      - LLAMA_N_GPU_LAYERS=${LLAMA_N_GPU_LAYERS:--1}
      - LLAMA_N_THREADS=${LLAMA_N_THREADS:-4}
      - LLAMA_SEED=${LLAMA_SEED:--1}
