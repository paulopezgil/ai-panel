services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ${AI_MODELS_DIR:-./models}:/app/ai_models
    environment:
      - AI_MODELS_DIR=/app/ai_models
      - HF_TOKEN=${HF_TOKEN:-}
    networks:
      - ai-panel-net

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - ai-panel-net

networks:
  ai-panel-net:
